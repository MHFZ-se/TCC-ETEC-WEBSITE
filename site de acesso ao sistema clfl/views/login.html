{% extends 'template_null.html' %}

{% block content %} <!--isto indica o uso de um codigo .py-->
    <main>
        <h1 class="titulo">Login codigo ou e-mail </h1>
        <h2 class="subTitulo">Faça o Login</h2>
            <hr>
        <div class="col-md-4">
        <form action="{{url_for('login')}}" method="post">
            <label for="name">Email:</label>
            <input type="text" name="email" placeholder="Insira o email" class="form-control" required>
            <label for="name">Senha:</label>
            <input type="password" name="senha" placeholder="Insira a senha" class="form-control" required>
            <h6>Não possui conta? <a href="{{url_for('cadastro')}}">Cadastre-se!!!</a></h6>
            <!-- <label for="name">IP:</label>
            <input type="text" name="ip" placeholder="Insira o IP do dispositivo" class="form-control" required> -->
            <br>
            <input type="submit" value="Cadastrar" class="button">
            <!-- <input type="reset" value="Limpar" class="btn btn-outline-danger"> -->
        </form>
        
        </div>
    </main>
{% endblock content %}
