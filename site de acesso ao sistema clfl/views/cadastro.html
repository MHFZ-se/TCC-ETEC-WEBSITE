{% extends 'template_null.html' %}

{% block content %} <!--isto indica o uso de um codigo .py-->
    <main>
        <div class="col-md-4">
            <form action="{{url_for('cadastro')}}" method="POST" >
                <label>Informe seu nome completo</label><br>
                <input type="text" name="nome" placeholder="Nome"><br>
                <label>Informe seu Telefone</label><br>
                <input type="text" name="telefone" placeholder="ex: 551302154298"><br>
                <label>Informe uma senha</label><br>
                <input type="text" name="senha" placeholder="Lembre bem"><br>
                <label>Passe um email seu </label><br>
                <input type="text" name="email" placeholder="emailexemplo@outlook.com"><br>

                <input type="submit" value="Registrar novo usuario">
                <label for="">Você será redirecionado para a pagina inicial e devera logar com email e senha</label>
                
            </form>
        </div>
    </main>
{% endblock content %}
